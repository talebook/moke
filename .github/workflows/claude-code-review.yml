name: Claude Review

on:
  pull_request:
    types: [opened, synchronize]
    # 可选：限制仅在特定文件变更时触发
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # 可选：按 PR 作者过滤
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read           # 允许读取代码
      pull-requests: write     # 允许发表评论和添加标签
      actions: read
      id-token: write          # OIDC 认证（如果需要）

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 获取完整历史，便于审查

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LiteLLM proxy
        run: python -m pip install 'litellm[proxy]==1.97.0' 'fastapi==0.139.2'

      - name: Create LiteLLM config
        run: |
          cat > litellm_config.yaml << 'EOF'
          model_list:
            - model_name: deepseek-v4-pro
              litellm_params:
                model: openai/deepseek-v4-pro
                api_base: ${{ secrets.OPENCODE_GO_API_URL }}
                api_key: ${{ secrets.OPENCODE_GO_API_KEY }}
                drop_params: true
                max_tokens: 4096
          litellm_settings:
            drop_params: true
          general_settings:
            master_key: sk-proxy-key
          EOF

      - name: Start LiteLLM proxy
        env:
          LITELLM_USE_CHAT_COMPLETIONS_URL_FOR_ANTHROPIC_MESSAGES: "true"
        run: |
          litellm --config litellm_config.yaml --port 8080 > "$RUNNER_TEMP/litellm.log" 2>&1 &
          litellm_pid=$!

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health/liveliness; then
              echo "LiteLLM proxy is ready"
              exit 0
            fi

            if ! kill -0 "$litellm_pid" 2>/dev/null; then
              echo "LiteLLM proxy exited before becoming ready"
              cat "$RUNNER_TEMP/litellm.log"
              exit 1
            fi

            sleep 1
          done

          echo "LiteLLM proxy did not become ready within 30 seconds"
          cat "$RUNNER_TEMP/litellm.log"
          exit 1

      - name: Run Claude Review via DeepSeek
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # ---- 接入配置 ----
          ANTHROPIC_BASE_URL: http://localhost:8080
          ANTHROPIC_AUTH_TOKEN: sk-proxy-key
          # ---- 模型指定 ----
          ANTHROPIC_MODEL: "deepseek-v4-pro"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-pro"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-v4-pro"
          CLAUDE_CODE_SUBAGENT_MODEL: "deepseek-v4-pro"
        with:
          anthropic_api_key: sk-proxy-key
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Provide detailed feedback using inline comments for specific issues.
            Please respond in Simplified Chinese.

          # ---- claude_args 传递额外参数 ----
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Show LiteLLM logs on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/litellm.log" ]; then
            echo "Last 500 lines from the LiteLLM proxy:"
            tail -n 500 "$RUNNER_TEMP/litellm.log"
          else
            echo "LiteLLM log file was not created"
          fi
