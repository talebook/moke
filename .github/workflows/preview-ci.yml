name: Preview CI

on:
  push:
    branches:
      - main
      - 'preview/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: preview-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Frontend quality and Preview output
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          standalone: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Build Preview frontend
        run: pnpm build:preview

      - name: Verify Preview output contains no source maps
        shell: bash
        run: |
          set -euo pipefail
          if find out -type f -name '*.map' -print -quit | grep -q .; then
            echo 'Preview output contains source map files' >&2
            exit 1
          fi
          if grep -RIlE 'sourceMappingURL[[:space:]]*=' out; then
            echo 'Preview output contains sourceMappingURL references' >&2
            exit 1
          fi

  rust:
    name: Rust ${{ matrix.channel }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            features: ''
          - channel: preview
            features: '--features preview'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: preview-${{ matrix.channel }}

      - name: Run Rust library tests
        working-directory: src-tauri
        run: cargo test --lib --locked ${{ matrix.features }}

  control-plane:
    name: Preview control-plane tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        working-directory: services/preview-control-plane
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: services/preview-control-plane
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        working-directory: services/preview-control-plane
        run: cargo test --locked

      - name: Validate hardened Compose configuration
        working-directory: services/preview-control-plane
        run: docker compose config --quiet --no-interpolate
