name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && github.event.review.body && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ocgo
        run: |
          curl -fsSL https://raw.githubusercontent.com/kiowx/ocgo/main/install.sh | bash
          sudo mv ocgo /usr/local/bin/

      - name: Start ocgo proxy with Kimi K3
        env:
          OCGO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          ocgo launch claude --model kimi-k3 --port 11434 &
          sleep 5

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: "http://127.0.0.1:11434"
          ANTHROPIC_MODEL: kimi-k3
          ANTHROPIC_DEFAULT_OPUS_MODEL: kimi-k3
          ANTHROPIC_DEFAULT_SONNET_MODEL: kimi-k3
          ANTHROPIC_DEFAULT_HAIKU_MODEL: kimi-k3
          CLAUDE_CODE_SUBAGENT_MODEL: kimi-k3
        with:
          anthropic_api_key: "dummy-key"
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue:*),Bash(gh search:*),Bash(gh label:*),Bash(git fetch:*),Bash(gh api:*),Bash(curl:*),WebFetch"