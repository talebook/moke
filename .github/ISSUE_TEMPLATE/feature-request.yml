name: 功能建议
description: 提议新功能或改进现有使用体验
title: "[Feature] "
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        感谢为墨客提出建议。请说明需求背景和期望的使用方式，具体场景会帮助我们更准确地评估方案。

  - type: dropdown
    id: area
    attributes:
      label: 功能领域
      description: 请选择建议主要涉及的功能。
      options:
        - 连接与账号
        - 书库、搜索与书架
        - 书籍详情
        - 在线阅读
        - 下载与离线阅读
        - 设置与显示
        - 平台适配
        - 其他
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 请描述在什么场景下遇到了什么不便，以及现有功能为什么不能满足需求。
      placeholder: 当我……时，目前只能……，因此……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述期望的功能、入口和操作流程。
      placeholder: 我希望可以……
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: 预期价值
      description: 请说明这个改进会解决什么问题，以及哪些使用者可能受益。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 如果目前有临时解决办法或参考应用，可以在这里说明。

  - type: textarea
    id: references
    attributes:
      label: 参考资料或示意图
      description: 可粘贴参考链接，或直接拖入流程图、界面草图和截图。请勿包含敏感信息。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同或高度相似的建议。
          required: true
        - label: 我已尽量说明具体使用场景，而不只是描述一个功能名称。
          required: true
