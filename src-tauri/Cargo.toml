[package]
name = "moke"
version = "0.1.0"
description = "Moke - Talebook Client"
authors = ["Moke"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "moke_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { path = "../tauri/crates/tauri-build", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { path = "../tauri/crates/tauri", default-features = false, features = [
  "wry",
  "protocol-asset",
  "compression",
  "dynamic-acl",
] }
tauri-plugin-fs = "=2.5.1"
tauri-plugin-http = { version = "=2.5.9", features = ["cookies", "dangerous-settings"] }
tauri-plugin-os = "=2.3.2"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-opener = "=2.5.4"

# Reader plugins — compiled unconditionally so the reader works on OHOS
# (matching how readest standalone builds).
readestlib = { package = "Readest", path = "../readest/apps/readest-app/src-tauri", default-features = false }
tauri-plugin-websocket = "2"
tauri-plugin-process = "2"
tauri-plugin-oauth = "2"
tauri-plugin-device-info = "1.0.1"
tauri-plugin-log = "2"
tauri-plugin-native-bridge = { path = "../readest/apps/readest-app/src-tauri/plugins/tauri-plugin-native-bridge" }
tauri-plugin-native-tts = { path = "../readest/apps/readest-app/src-tauri/plugins/tauri-plugin-native-tts" }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
tiny_http = "0.12"
tungstenite = "0.24"

# Plugins that depend on native Linux libraries (gtk/x11)
# and cannot cross-compile to OHOS.
[target.'cfg(not(target_env = "ohos"))'.dependencies]
tauri = { path = "../tauri/crates/tauri", default-features = false, features = [
  "common-controls-v6",
  "x11",
  "dbus",
] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-turso = { path = "../readest/apps/readest-app/src-tauri/plugins/tauri-plugin-turso" }

[target.'cfg(target_env = "ohos")'.dependencies]
napi-ohos = "1.1"
napi-derive-ohos = "1.1"

[patch.crates-io]
tauri = { path = "../tauri/crates/tauri" }
tauri-build = { path = "../tauri/crates/tauri-build" }
tauri-codegen = { path = "../tauri/crates/tauri-codegen" }
tauri-macros = { path = "../tauri/crates/tauri-macros" }
tauri-plugin = { path = "../tauri/crates/tauri-plugin" }
tauri-runtime = { path = "../tauri/crates/tauri-runtime" }
tauri-runtime-wry = { path = "../tauri/crates/tauri-runtime-wry" }
tauri-utils = { path = "../tauri/crates/tauri-utils" }

wry = { git = "https://github.com/tauri-apps/wry", branch = "feat/open-harmony" }
tao = { git = "https://github.com/tauri-apps/tao", branch = "feat/open-harmony" }

openharmony-ability = { git = "https://github.com/harmony-contrib/openharmony-ability.git" }
openharmony-ability-derive = { git = "https://github.com/harmony-contrib/openharmony-ability.git" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
